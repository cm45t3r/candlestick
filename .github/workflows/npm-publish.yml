# Publishes the package to npm, on demand only.
#
# The automatic tag trigger is disabled. Authentication is still the expired
# NPM_TOKEN secret, which fails the publish with E404 on PUT — that is how
# v2.1.0 was tagged and released on GitHub but never reached the registry.
# Leaving the trigger on would only add a red run to every release.
#
# Restore the `push: tags` trigger once the package is configured for Trusted
# Publishing on npmjs.com, which replaces the secret with an OIDC exchange.
# That also requires npm >= 11.5.1 in this job (Node 20 ships npm 10) and
# dropping the NODE_AUTH_TOKEN env below.
#
# The trigger was never the GitHub Release: Release Automation creates the
# release with secrets.GITHUB_TOKEN, and GitHub does not start new workflow
# runs from events raised by that token, so an `on: release` trigger never
# fired — every version on npm so far was published by hand.

name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish, e.g. v2.2.0"
        required: true
        type: string

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - run: npm ci
      - run: npm run lint
      - run: npm test

  publish-npm:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required by `npm publish --provenance`, which mints a signed
      # attestation from an OIDC token. Without it the publish fails.
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/
      - name: Verify tag matches package.json version
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag $TAG does not match package.json version $PKG"
            exit 1
          fi
          echo "publishing $PKG"
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
