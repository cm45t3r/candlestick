# Stages the package for publishing when a v*.*.* tag is pushed.
#
# This does not make the version public. It uploads the built, tested artifact
# and defers the 2FA proof-of-presence, so a human still has to approve before
# anyone can install it:
#
#   npm stage list                 # find the staged version
#   npm stage view <stage-id>      # inspect what CI built
#   npm stage approve <stage-id>   # publish it, with 2FA
#   npm stage reject <stage-id>    # discard it
#
# Direct publishing is possible and npm advises against it: a tag push would
# then reach every consumer with nothing in between, so anyone able to push a
# tag — or to compromise a third-party action used here — could publish
# unreviewed. The trusted publisher on npmjs.com is configured to allow staging
# only, which is what makes that a setting rather than a convention.
#
# Authentication is Trusted Publishing: the job exchanges a GitHub OIDC token
# for a short-lived npm credential, so there is no NPM_TOKEN secret to expire.
# The previous secret did expire, which is why v2.1.0 was tagged and released
# on GitHub but never reached the registry — npm answers an unauthorised PUT
# with 404, not 401.
#
# This requires a matching trusted publisher on npmjs.com, configured against
# this repository and this workflow filename. Renaming this file breaks the
# publish until the setting is updated to match.
#
# The trigger is the tag, not the GitHub Release. Release Automation creates
# the release with secrets.GITHUB_TOKEN, and GitHub does not start new workflow
# runs from events raised by that token, so an `on: release` trigger never
# fires.

name: Stage for npm

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish, e.g. v3.0.1"
        required: true
        type: string

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci
      - run: npm run lint
      - run: npm test

  stage-npm:
    name: Stage for npm
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The OIDC token Trusted Publishing exchanges for a publish credential,
      # and that `--provenance` signs the attestation with. Without it the
      # publish cannot authenticate at all.
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v6
        with:
          # Node 24 ships npm 11.19; Node 22 ships 10.9, which predates OIDC
          # publishing. The build job above still runs on 22, the oldest
          # supported runtime.
          node-version: 24
          registry-url: https://registry.npmjs.org/
      - name: Ensure npm supports Trusted Publishing
        # Pinned rather than assumed: a runner image that shipped an older npm
        # would otherwise fail later, at the publish, with an auth error that
        # does not mention the cause.
        run: |
          npm install -g npm@^11.5.1
          echo "npm $(npm --version)"
      - name: Verify tag matches package.json version
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag $TAG does not match package.json version $PKG"
            exit 1
          fi
          echo "publishing $PKG"
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # No NODE_AUTH_TOKEN: the credential comes from the OIDC exchange above.
      # Staged, not published: approve it with `npm stage approve <stage-id>`.
      - run: npm stage publish . --provenance
      - name: Say what to do next
        run: |
          echo "::notice::Staged ${{ inputs.tag || github.ref_name }}. Run 'npm stage list' then 'npm stage approve <stage-id>' to publish it."
